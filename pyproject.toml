[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "endurance-setup-coach"
version = "0.13.0"
description = "Local, evidence-led iRacing endurance setup coach"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "polars>=1.30,<2", "duckdb>=1.2,<2", "streamlit>=1.67,<2", "PyYAML>=6,<7", "plotly>=6,<7", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
windows-build = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
include = ["endurance*"]

[tool.setuptools.package-data]
endurance = ["ui_assets/*.html", "ui_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

name: Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt pyinstaller==6.22.3
      - name: Run tests
        run: python -X utf8 -m pytest -q
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match pyproject.toml.'
          }
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') {
            throw 'Inno Setup download did not match its published SHA-256.'
          }
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PORTABLE',('/DIR="' + $inno + '"') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup failed with exit code $($install.ExitCode)." }
          ./scripts/build_windows.ps1 -Python python -Iscc (Join-Path $inno 'ISCC.exe')
      - name: Smoke test installed executable
        shell: pwsh
        run: ./scripts/smoke_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "IR Setup Helper $GITHUB_REF_NAME" --generate-notes

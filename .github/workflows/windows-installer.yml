name: Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt pyinstaller==6.22.3
      - name: Run tests
        run: python -X utf8 -m pytest -q
      - name: Build standalone and combined installers
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match pyproject.toml.'
          }
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') {
            throw 'Inno Setup download did not match its published SHA-256.'
          }
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PORTABLE',('/DIR="' + $inno + '"') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup failed with exit code $($install.ExitCode)." }
          $registration = Get-Content -Raw packaging/registration-release.json | ConvertFrom-Json
          $runtimeName = "iracing-registration-runtime-$($registration.version).zip"
          $runtimePath = Join-Path $env:RUNNER_TEMP $runtimeName
          $runtimeUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/registration-v$($registration.version)/$runtimeName"
          Invoke-WebRequest $runtimeUrl -OutFile $runtimePath
          if ((Get-FileHash -LiteralPath $runtimePath).Hash -ne $registration.sha256) {
            throw 'Registration runtime checksum did not match the pinned release.'
          }
          $iscc = Join-Path $inno 'ISCC.exe'
          ./scripts/build_windows.ps1 -Python python -Iscc $iscc
          ./scripts/build_windows.ps1 -Python python -Iscc $iscc -ReuseSetupBundle -RegistrationPackage $runtimePath
      - name: Smoke test both installers
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          ./scripts/smoke_windows.ps1 -Installer "dist/IRSetupHelper-$version-windows-x64-setup.exe"
          ./scripts/smoke_windows.ps1 -Installer "dist/IRacingTools-$version-windows-x64-setup.exe" -WithRegistration
      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $installers = @("IRSetupHelper-$version-windows-x64-setup.exe", "IRacingTools-$version-windows-x64-setup.exe")
          $files = @($installers | ForEach-Object { "dist/$_"; "dist/$_.sha256" })
          $existing = gh release view $env:GITHUB_REF_NAME --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $uploaded = ($existing | ConvertFrom-Json).assets.name
            if (@($files | Where-Object { (Split-Path $_ -Leaf) -notin $uploaded }).Count) {
              throw 'An existing release is missing installer assets.'
            }
            return
          }
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "iRacing Tools $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: windows-x64-installer
          path: dist/*
          if-no-files-found: error
